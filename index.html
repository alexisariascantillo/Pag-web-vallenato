<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epifanio Collante | La Voz Romántica del Vallenato</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-base: #FFFFFF;
            --surface-card: #FFFFFF;
            --text-main: #0A0A0A;
            --accent-gold: #C5A059;
            --gray-muted: #888888;
            --border-subtle: rgba(0, 0, 0, 0.1);
            --font-code: 'Fira Code', monospace;
            --spacing-container: clamp(20px, 5vw, 60px);
        }

        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- ENCABEZADO (SOLO PARA CONTEXTO) --- */
        header { position: fixed; top: 0; left: 0; width: 100%; padding: 20px var(--spacing-container); display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); z-index: 90; }
        .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; color: var(--text-main); text-decoration: none; }
        .vault-btn { font-size: 0.75rem; text-transform: uppercase; color: var(--accent-gold); background: none; border: none; border-bottom: 1px solid var(--accent-gold); cursor: pointer; }

        /* --- MODAL THE VAULT (REDISEÑADO) --- */
        .vault-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; padding: 20px; }
        .vault-modal.active { opacity: 1; pointer-events: auto; }
        
        .vault-content { 
            background: var(--surface-card); 
            border: 1px solid var(--border-subtle);
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); 
            padding: clamp(40px, 6vw, 60px); 
            max-width: 500px; 
            width: 100%; 
            position: relative; 
            text-align: center; 
            opacity: 0; 
            transform: scale(0.95); 
            transition: opacity 0.4s ease, transform 0.4s ease;
            border-radius: 2px;
        }
        .vault-modal.active .vault-content { opacity: 1; transform: scale(1); }

        .close-vault { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--gray-muted); font-size: 1.5rem; cursor: pointer; transition: color 0.3s; }
        .close-vault:hover { color: var(--text-main); }

        /* --- EL LOGOTIPO DENTRO DEL MODAL --- */
        .modal-logo { 
            max-width: 140px; 
            width: 100%; 
            height: auto; 
            object-fit: contain; 
            margin: 0 auto 25px auto; 
            display: block; 
        }

        .modal-title { 
            font-family: 'Syne', sans-serif; 
            font-size: 2.2rem; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-bottom: 15px; 
            color: var(--text-main); 
        }

        .modal-subtitle { 
            font-size: 0.9rem; 
            color: var(--gray-muted); 
            line-height: 1.6; 
            margin-bottom: 40px; 
            max-width: 350px; 
            margin-left: auto; 
            margin-right: auto;
        }

        .contact-group { margin-bottom: 25px; }
        .contact-label { font-family: var(--font-code); font-size: 0.75rem; color: var(--gray-muted); text-transform: uppercase; margin-bottom: 6px; }
        .contact-data { font-size: 1.1rem; color: var(--text-main); font-weight: 500; text-decoration: none; transition: color 0.3s; display: block; }
        .contact-data:hover { color: var(--accent-gold); }

        /* --- CTA REDISEÑADO --- */
        .cta-main { 
            display: block; 
            width: 100%; 
            background-color: var(--text-main); 
            color: var(--bg-base); 
            border: none; 
            padding: 18px; 
            font-family: 'Syne', sans-serif; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            cursor: pointer; 
            transition: all 0.4s ease; 
            margin-top: 40px; 
            margin-bottom: 40px; 
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.8rem;
        }
        .cta-main:hover { 
            background-color: var(--accent-gold); 
            color: var(--text-main); 
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.3);
        }

        .modal-socials { display: flex; justify-content: center; gap: 20px; border-top: 1px solid var(--border-subtle); padding-top: 20px; }
        .modal-social-link { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gray-muted); text-decoration: none; transition: color 0.3s; font-weight: 500; }
        .modal-social-link:hover { color: var(--accent-gold); }

        /* --- MEDIA QUERIES PARA ESTRUCTURA MOBILE (CORREGIDO) --- */
        @media (max-width: 600px) {
            .vault-content { padding: 30px; margin: 10px; }
            .modal-logo { max-width: 110px; margin-bottom: 15px; }
            .modal-title { font-size: 1.6rem; margin-bottom: 10px; }
            .modal-subtitle { margin-bottom: 25px; font-size: 0.8rem; }
            .contact-data { font-size: 1rem; }
            .cta-main { padding: 15px; margin-top: 30px; margin-bottom: 30px; }
            .modal-socials { gap: 15px; padding-top: 15px; }
            .modal-social-link { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-text">EPIFANIO COLLANTE</a>
        <button class="vault-btn" onclick="toggleVault()">CONTACTO</button>
    </header>

    <!-- SECCIÓN HERO DE ESPACIO (SOLO PARA DEMO) -->
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <h2 style="font-size: 4rem; color: var(--accent-gold);">BIENVENIDO</h2>
    </div>

    <!-- MODAL THE VAULT (ACTÍVALO DESDE EL BOTÓN DE ARRIBA O POR DEFECTO) -->
    <div class="vault-modal active" id="vaultModal">
        <div class="vault-content">
            <button class="close-vault" onclick="toggleVault()">&times;</button>
            
            <!-- EL LOGOTIPO AHORA ES LA PIEZA CENTRAL -->
            <img src="image_3fe82d.png" alt="Epifanio Collante Logo" class="modal-logo">
            
            <h2 class="modal-title">CONTÁCTANOS</h2>
            <p class="modal-subtitle">Gestión de Contrataciones para Eventos, Festivales y Eventos Privados.</p>
            
            <div class="contact-group">
                <p class="contact-label">Teléfono / WhatsApp</p>
                <!-- Al hacer clic en el teléfono, abre la app de llamadas o WhatsApp -->
                <a href="tel:+573158299357" class="contact-data">+57 315 829 9357</a>
            </div>

            <div class="contact-group">
                <p class="contact-label">Correo Electrónico</p>
                <a href="mailto:angelica.collanteperez@gmail.com" class="contact-data">angelica.collanteperez@gmail.com</a>
            </div>

            <!-- EL CTA AHORA ES UN BOTÓN DE ACCIÓN REAL -->
            <a href="mailto:angelica.collanteperez@gmail.com?subject=Solicitud de Contratación - Epifanio Collante" class="cta-main">
                SOLICITAR PROPUESTA
            </a>

            <div class="modal-socials">
                <a href="https://www.instagram.com/epifaniocollante" target="_blank" class="modal-social-link">Instagram</a>
                <a href="https://youtube.com/@musico415" target="_blank" class="modal-social-link">YouTube</a>
                <a href="https://www.facebook.com/share/1EnpsgvLqo/" target="_blank" class="modal-social-link">Facebook</a>
            </div>
        </div>
    </div>

    <script>
        function toggleVault() {
            const modal = document.getElementById('vaultModal');
            modal.classList.toggle('active');
        }
    </script>
</body>
</html>
