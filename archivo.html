<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Visual | Epifanio Collante</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg-base: #FFFFFF; --text-main: #0A0A0A; --accent-gold: #C5A059; --gray-muted: #666666; --border-subtle: rgba(0, 0, 0, 0.1); --font-code: 'Fira Code', monospace; --spacing-container: clamp(20px, 5vw, 60px); }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: transparent; z-index: 1000; }
        .progress-bar { height: 100%; background: var(--accent-gold); width: 0%; transition: width 0.1s ease; }

        header { position: fixed; top: 0; left: 0; width: 100%; padding: clamp(15px, 3vh, 30px) var(--spacing-container); display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(to bottom, rgba(255,255,255,0.98), rgba(255,255,255,0.85)); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); }
        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(0.85rem, 1.8vw, 1.1rem); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-main); text-decoration: none; }
        .nav-links { display: flex; gap: clamp(10px, 2.5vw, 30px); align-items: center; }
        .nav-link { font-size: clamp(0.65rem, 1vw, 0.75rem); text-transform: uppercase; letter-spacing: 1px; color: var(--gray-muted); text-decoration: none; font-weight: 500; }
        .nav-link.active { color: var(--text-main); border-bottom: 1px solid var(--text-main); }
        .btn-back { font-family: var(--font-code); font-size: 0.8rem; color: var(--gray-muted); text-decoration: none; display: flex; align-items: center; gap: 8px; }

        .vault-header { padding: clamp(150px, 20vh, 200px) var(--spacing-container) 80px var(--spacing-container); max-width: 1400px; margin: 0 auto; border-bottom: 1px solid var(--border-subtle); opacity: 0; transform: translateY(30px); }
        .vault-header h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.5rem, 5vw, 5rem); font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-bottom: 20px; }
        .vault-header h1 span { color: var(--accent-gold); }
        .vault-meta { font-family: var(--font-code); font-size: 0.85rem; color: var(--gray-muted); display: flex; gap: 40px; flex-wrap: wrap; }

        .gallery-container { padding: 80px var(--spacing-container); max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(20px, 3vw, 30px); align-items: start; }
        .frame { position: relative; background: var(--text-main); overflow: hidden; opacity: 0; transform: translateY(50px); }
        .frame-large { grid-column: span 12; aspect-ratio: 2.35 / 1; }
        .frame-tall { grid-column: span 5; aspect-ratio: 3 / 4; }
        .frame-square { grid-column: span 7; aspect-ratio: 4 / 3; }
        .frame img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.2); opacity: 0.8; transition: filter 0.8s ease, transform 1.2s ease; }
        .frame:hover img { filter: grayscale(0%) contrast(1); opacity: 1; transform: scale(1.03); }
        .frame-ui { position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; transition: opacity 0.4s ease; }
        .frame:hover .frame-ui { opacity: 1; }
        .ui-top { display: flex; justify-content: space-between; font-family: var(--font-code); font-size: 0.75rem; color: #FFFFFF; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .ui-bottom { font-family: 'Syne', sans-serif; font-size: clamp(1rem, 1.5vw, 1.5rem); font-weight: 700; color: #FFFFFF; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        @media (max-width: 900px) { .frame-tall, .frame-square { grid-column: span 12; aspect-ratio: 16 / 9; } .frame-large { aspect-ratio: 16 / 9; } }
        @media (max-width: 600px) { header { flex-direction: column; align-items: flex-start; gap: 12px; } .nav-links { width: 100%; justify-content: space-between; } }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>

    <header>
        <a href="index.html" class="logo">EPIFANIO COLLANTE</a>
        <div class="nav-links">
            <a href="index.html" class="btn-back">← UMBRAL</a>
            <a href="acerca.html" class="nav-link">Acerca de mí</a>
            <a href="archivo.html" class="nav-link active">Archivo</a>
            <a href="discografia.html" class="nav-link">Discografía</a>
        </div>
    </header>

    <section class="vault-header">
        <h1>Archivo <span>Fotográfico.</span></h1>
        <div class="vault-meta">
            <span>REGISTROS: 04 ACTIVOS</span>
            <span>FORMATO: DIRECTO ESCENARIO</span>
        </div>
    </section>

    <main class="gallery-container">
        <!-- Fotograma 1: Imagen de Tarima en Vivo -->
        <div class="frame frame-large">
            <img src="image_3fe847.jpg" alt="Epifanio Collante Tarima">
            <div class="frame-ui"><div class="ui-top"><span>SCENE 01</span><span>LIVE STAGE</span></div><div class="ui-bottom">LA FUERZA DEL VALLENATO.</div></div>
        </div>
        <!-- Fotograma 2: Concierto / Luces -->
        <div class="frame frame-tall">
            <img src="image_3fe84b.jpg" alt="Concierto Epifanio">
            <div class="frame-ui"><div class="ui-top"><span>SCENE 02</span><span>CONCERT RAW</span></div><div class="ui-bottom">CONEXIÓN ABSOLUTA.</div></div>
        </div>
        <!-- Fotograma 3: Escenario y Luces Rojas -->
        <div class="frame frame-square">
            <img src="image_3fe865.jpg" alt="Escenario Gira">
            <div class="frame-ui"><div class="ui-top"><span>SCENE 03</span><span>TOUR SETUP</span></div><div class="ui-bottom">EL RITMO DE LA SABANA.</div></div>
        </div>
    </main>

    <script>
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById("myBar").style.width = (winScroll / height) * 100 + "%";
        };

        gsap.to(".vault-header", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" });
        gsap.utils.toArray('.frame').forEach((frame, i) => {
            gsap.to(frame, { scrollTrigger: { trigger: frame, start: "top 85%" }, opacity: 1, y: 0, duration: 1, ease: "power4.out", delay: i * 0.15 });
        });
    </script>
</body>
</html>
